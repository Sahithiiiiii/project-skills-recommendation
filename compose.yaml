services:
  postgres:
    image: postgres:16
    container_name: pathforge-postgres
    environment:
      POSTGRES_DB: pathforge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pathforge_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: pathforge-backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    depends_on:
      - postgres

  frontend:
    build: ./frontend
    container_name: pathforge-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data: